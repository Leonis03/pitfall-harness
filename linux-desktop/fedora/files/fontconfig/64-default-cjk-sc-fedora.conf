<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  linux-desktop/fedora/files/fontconfig/64-default-cjk-sc-fedora.conf

  Deploy to: /etc/fonts/conf.d/64-default-cjk-sc-fedora.conf
  Then:     fc-cache -f

  Why this file exists on Fedora:

  1. Fedora ships the Noto CJK variable fonts with one family per region
     (Noto Sans CJK SC / TC / HK / JP / KR), not the region-less "Noto Sans CJK"
     that the Mint rule in linux-desktop/files/fontconfig/64-default-cjk-sc.conf
     matches and rewrites. A rule written for the region-less family matches
     nothing here, and its TTC-index reasoning does not apply either.

  2. What is actually broken on Fedora is the BCP-47 form: the modern web
     standard "zh-Hans" (and the region-less "zh") does not match the
     lang="zh-cn" rule that the Noto CJK config provides, so it falls through
     to the Latin families. Measured before this file:

       fc-match "sans-serif:lang=zh-Hans" -> NotoSans-Regular.ttf   (Latin)
       fc-match "sans-serif:lang=zh"      -> NotoSans-Regular.ttf   (Latin)
       fc-match "sans-serif:lang=zh-cn"   -> Noto Sans CJK SC      (correct)

  3. Droid Sans Fallback is installed on Fedora and its rule sits at priority
     69, after the Noto CJK rules at 65. The prefer lists below keep it out of
     the first choice for Simplified Chinese, while zh-TW / zh-HK still reach
     the Traditional faces.
-->
<fontconfig>
  <!-- 0. Normalize the modern BCP-47 Chinese tags to the ones Fedora's
       Noto CJK rules actually match -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hans</string></test>
    <edit name="lang" mode="assign"><string>zh-cn</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <edit name="lang" mode="assign"><string>zh-cn</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-my</string></test>
    <edit name="lang" mode="assign"><string>zh-cn</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <edit name="lang" mode="assign"><string>zh-tw</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-jp</string></test>
    <edit name="lang" mode="assign"><string>ja</string></edit>
  </match>

  <!-- 1. Region-less Chinese: pick the Simplified faces explicitly -->
  <match target="pattern">
    <test name="lang"><string>zh</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <!-- 2. Default fallback order for the generic families -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK HK</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK HK</family>
      <family>Noto Serif CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK HK</family>
      <family>Noto Sans Mono CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
